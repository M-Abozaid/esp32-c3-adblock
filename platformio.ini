[platformio]
default_envs = c3

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

# LILYGO T-Display-S3 (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM, ST7789 170x320).
# Uses the lilygo-t-display-s3 board definition (not esp32s3box): flash mode,
# USB CDC and qio_opi PSRAM already come from the board manifest.
[env:lilygo-t-display-s3]
board = lilygo-t-display-s3
board_build.partitions = partitions_s3.csv
build_flags =
    -DLILYGO_T_DISPLAY_S3=1
lib_deps =
    moononournation/GFX Library for Arduino@1.3.6
