[platformio]
default_envs = c3

[env]
; Pinned: newer platforms (e.g. espressif32@8 / core 3.3.12) build the C3 image ~130 KB
; larger and overflow the 1,376,256-byte OTA slot. This is the toolchain the firmware is
; tested on (Arduino core 3.3.7). Bump deliberately, checking `pio run -e c3` size.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp8266]
platform = espressif8266@4.2.1   ; pinned like the ESP32 platform above
framework = arduino
board = nodemcuv2
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld   ; 2 MB FS: a 128k-domain list (642 KB) must fit live + staged
board_upload.maximum_size = 1044464
monitor_speed = 115200
build_flags =
    -DINDEX_ENTRIES=1024
    -DCACHE_SIZE=64
    -DMAX_RANGE=256
    -DMAX_CLIENTS=32
    -DMAX_CUSTOM=50
