name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [c3, esp32dev, esp8266]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -U platformio
      - name: Placeholder secrets (real ones are gitignored; the firmware falls back to the setup portal)
        run: cp src/secrets.example.h src/secrets.h
      - run: pio run -e ${{ matrix.env }}

  blocklist-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse hosts, plain and AdGuard-style input
        run: |
          printf '||ads.example.com^\n@@||ok.example.org^\n||ok.example.org^\n0.0.0.0 hosts.example.com\nplain.example.com\n/^regex$/\n' > t.txt
          python3 tools/build_blocklist.py t.bin t.txt
          test "$(stat -c%s t.bin)" -eq 15   # 3 entries x 5 bytes
      - name: Unit tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

  # Prebuilt binaries are not byte-reproducible (the image embeds a build timestamp),
  # so the committed docs/ assets are NOT auto-committed from CI. Instead every push
  # produces a fresh, guaranteed-current set as a downloadable artifact, and the
  # committed assets are regenerated manually via tools/build_web_installer.sh when
  # the firmware or partition table changes. This closes the window where docs/
  # served a months-old firmware that predated the auth/CSRF hardening.
  web-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -U platformio
      - name: Placeholder secrets (real ones are gitignored; the firmware falls back to the setup portal)
        run: cp src/secrets.example.h src/secrets.h
      - name: Rebuild browser-installer assets (docs/)
        run: tools/build_web_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-installer-docs
          path: docs/
          retention-days: 90
